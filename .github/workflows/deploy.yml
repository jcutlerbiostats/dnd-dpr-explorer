# Build the Shinylive site and publish it to GitHub Pages on every push to main.
name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:            # notes-only commits must not trigger a redeploy (Pages 404s briefly mid-deploy)
      - '**.md'
      - 'tests/**'
      - '*.Rproj'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::shinylive
            cran::shiny
            cran::bslib
            cran::dplyr
            cran::purrr
            cran::tibble
            cran::httpuv
      - name: Export Shinylive site
        run: Rscript scripts/export_shinylive.R
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
